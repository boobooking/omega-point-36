---
include:
  # Central half: carries the keymap, unlockable from ZMK Studio.
  - board: ergohaven
    shield: op36_left
    keymap: op36_ruen
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: op36_left_ruen-ergohaven-zmk

  # Peripheral half: no keymap of its own.
  - board: ergohaven
    shield: op36_right

  # Wipes stored settings and BLE pairings.
  - board: ergohaven
    shield: settings_reset

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
CONFIG_ZMK_PM_SOFT_OFF=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=3
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=7

# The split peripheral (right half) is allowed to skip this many connection
# events before it has to be heard. Stock ZMK asks for 30, which delays its key
# events relative to the central's own local ones — a chord whose modifier lives
# on the right half then loses the race and the modifier is dropped entirely.
# Zero makes both halves participate in every connection interval, at some cost
# in battery life. Raise it again if the trade turns out to be a bad one.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

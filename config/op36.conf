CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
CONFIG_ZMK_PM_SOFT_OFF=y

# The ergohaven board defconfig turns pointing on for every board it covers
# (boards/arm/ergohaven/ergohaven_defconfig). The op36 has no pointing device,
# so it is switched back off here. ZMK's own default is n — see
# app/src/pointing/Kconfig, where it is y only under the deprecated ZMK_MOUSE.
CONFIG_ZMK_POINTING=n

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=3
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=7

# BT_PERIPHERAL_PREF_LATENCY is deliberately left at ZMK's default of 30. It was
# once set to 0 while chasing a chord that dropped its modifier; that turned out
# to be require-prior-idle-ms in the keymap, and the change bought nothing while
# costing battery on both halves. Don't set it again without evidence that a
# peripheral-side delay is the actual problem.

# Layout resync. Restoring a language is safe on any host; resetting one is only
# safe on a host known to reset its own layout after sleep, and neither has been
# checked yet. Task 5 turns on the bit for the Mac.
CONFIG_ZMK_LAYOUT_RESYNC_RESET_PROFILES=0x0

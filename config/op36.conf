CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
CONFIG_ZMK_PM_SOFT_OFF=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=3
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=7

# BT_PERIPHERAL_PREF_LATENCY is deliberately left at ZMK's default of 30. It was
# once set to 0 while chasing a chord that dropped its modifier; that turned out
# to be require-prior-idle-ms in the keymap, and the change bought nothing while
# costing battery on both halves. Don't set it again without evidence that a
# peripheral-side delay is the actual problem.
